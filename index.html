<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a3c5e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Deník staveb · Rekonstrukce Vrána</title>
<style>
  :root{
    /* iPhone: kdyz appka bezi z plochy, roztahne se i pres misto s hodinami
       a baterkou. Tyhle promenne rikaji, kolik mista si iOS bere. Na desktopu
       a v prohlizeci jsou nulove, takze se nic nemeni. */
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --navy:#1a3c5e; --navy-d:#132c46; --navy-l:#24507a;
    --amber:#f2a91f; --amber-d:#d98f0a; --amber-soft:#fdf3dd;
    --ink:#1f2933; --ink2:#61707e; --line:#e2e7ec; --bg:#eef1f4; --card:#fff;
    --ok:#15803d; --ok-soft:#e6f4ea; --wait:#b45309; --wait-soft:#fdf0da; --int:#526071; --int-soft:#e8ecf1; --red:#c0392b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  .topbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + var(--sat));position:sticky;top:0;z-index:60}
  .logo{font-weight:800;font-size:15px;letter-spacing:.3px;color:var(--navy)}
  .logo em{font-style:normal;color:var(--amber-d)}
  .topbar .sp{flex:1}
  .offdot{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px;background:var(--int-soft);color:var(--int);display:none}
  .offdot.off{display:inline-block;background:#fdeceb;color:var(--red)}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--amber);color:#132c46;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;cursor:pointer}
  .shell{display:flex;min-height:calc(100vh - 54px - var(--sat))}
  .side{width:78px;background:var(--navy);padding:8px 0;flex:none}
  .side .it{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;color:#c5d3e2;font-size:9.5px;font-weight:600;cursor:pointer;position:relative;text-align:center}
  .side .it .ic{font-size:19px}
  .side .it:hover{background:var(--navy-l)}
  .side .it.active{background:var(--navy-d);color:#fff;box-shadow:inset 3px 0 0 var(--amber)}
  .side .it .bdg{position:absolute;top:5px;right:12px;background:var(--amber);color:#132c46;font-size:10px;font-weight:800;border-radius:99px;padding:0 5px}
  .content{flex:1;min-width:0}
  .strip{background:#d7dde4;padding:9px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:53px;z-index:50;flex-wrap:wrap}
  .strip h1{font-size:15px;font-weight:700;color:#25313d}
  .strip .back{cursor:pointer;font-size:17px;color:#42505e}
  .strip .sp{flex:1}
  .strip .proj{text-align:right;line-height:1.2}
  .strip .proj b{font-size:13.5px;color:#25313d}
  .strip .proj small{color:#5c6a78;font-size:11px}
  .btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:99px;padding:8px 16px;font-size:12.5px;font-weight:800;cursor:pointer;letter-spacing:.3px}
  .btn.amber{background:var(--amber);color:#132c46}
  .btn.amber:hover{background:var(--amber-d)}
  .btn.dark{background:#3d4a57;color:#fff}
  .btn.ok{background:var(--ok);color:#fff}
  .btn.red{background:var(--red);color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.sm{padding:6px 12px;font-size:12px}
  .btn[disabled]{opacity:.5;cursor:default}
  main{padding:16px;max-width:1180px}
  .sectabs{display:flex;gap:2px;background:#fff;border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto}
  .sectabs .t{display:flex;align-items:center;gap:7px;padding:11px 16px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
  .sectabs .t.active{color:var(--navy);border-bottom-color:var(--amber);background:var(--amber-soft)}
  .sectabs .t.dis{opacity:.45;cursor:default}
  .tablecard{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .tabletools{padding:12px 14px;display:flex;gap:10px;align-items:center}
  .search{position:relative;width:280px;max-width:60%}
  .search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 30px 8px 12px;font:inherit}
  .search:after{content:'🔍';position:absolute;right:9px;top:7px;font-size:13px;opacity:.5}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11.5px;color:#54626f;font-weight:700;padding:9px 10px;border-bottom:2px solid #cfd7de;border-right:1px solid #edf1f4;white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid #edf1f4;border-right:1px solid #f3f6f8;vertical-align:middle}
  tr:hover td{background:#f7fafc}
  tr.click{cursor:pointer}
  td a,.lnk{color:var(--ink);text-decoration:underline;font-weight:600;cursor:pointer}
  .muted{color:var(--ink2)}
  .badge{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}
  .b-ok{background:var(--ok-soft);color:var(--ok)} .b-wait{background:var(--wait-soft);color:var(--wait)} .b-int{background:var(--int-soft);color:var(--int)} .b-red{background:#fdeceb;color:var(--red)}
  .toggle{width:34px;height:18px;border-radius:99px;background:#cdd5dc;position:relative;display:inline-block;cursor:pointer;flex:none}
  .toggle.on{background:var(--amber)}
  .toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle.on i{left:18px}
  .pagefoot{display:flex;align-items:center;gap:6px;padding:11px 14px;color:var(--ink2);font-size:12.5px}
  .datestrip{display:flex;gap:6px;align-items:center;background:#fff;padding:10px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
  .dchip{flex:none;border:1px solid var(--line);border-radius:8px;padding:5px 11px;text-align:center;cursor:pointer;background:#fff}
  .dchip small{display:block;font-size:9.5px;font-weight:800;color:var(--ink2);letter-spacing:.5px}
  .dchip b{font-size:12.5px}
  .dchip.active{background:var(--amber);border-color:var(--amber)}
  .dchip.active small,.dchip.active b{color:#132c46}
  .dchip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:4px}
  .grid-detail{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:900px){.grid-detail,.grid2{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
  .card h3{font-size:14px;margin-bottom:10px;color:var(--navy)}
  .chip-author{display:inline-flex;align-items:center;gap:7px;background:var(--amber);color:#132c46;font-weight:700;border-radius:8px;padding:6px 12px;font-size:12.5px;margin-bottom:12px}
  .worklist{margin:4px 0 4px 18px}
  .worklist li{margin-bottom:4px}
  .inote{background:#fffbeb;border:1px dashed #ecd9a0;border-radius:8px;padding:8px 11px;font-size:12.5px;margin-top:10px;color:#7c5806}
  label{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;display:block;margin:12px 0 5px}
  textarea,select,input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=time],input[type=tel]{font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;background:#fff;color:var(--ink)}
  /* iOS Safari kresli datum vlastnim vzhledem a ignoruje sirku rodice —
     "cihla terminu" pak pretekala pres kartu. Vynutime vzhled i sirku. */
  input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;max-width:100%;background:#fff;box-sizing:border-box}
  textarea{min-height:90px;resize:vertical}
  .photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .ph{width:104px;height:82px;border-radius:9px;position:relative;overflow:hidden;background:#33475c;cursor:pointer;flex:none}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph small{position:absolute;left:0;right:0;bottom:0;background:rgba(10,20,32,.62);color:#fff;font-size:9.5px;font-weight:600;padding:2px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ph .st{position:absolute;top:4px;right:4px;font-size:10px;background:rgba(255,255,255,.93);color:var(--ink);border-radius:99px;padding:1px 6px;font-weight:700}
  .ph .del{position:absolute;top:4px;left:4px;font-size:10px;background:rgba(192,57,43,.92);color:#fff;border-radius:99px;padding:1px 6px;font-weight:700}
  .aprv{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .note{font-size:12px;color:var(--ink2);background:var(--int-soft);border-radius:9px;padding:9px 12px;margin-top:6px}
  .empty{text-align:center;color:var(--ink2);padding:28px 10px}
  .prog{height:7px;background:var(--int-soft);border-radius:99px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--amber);border-radius:99px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#10233a;color:#fff;border-radius:99px;padding:10px 20px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200;max-width:92vw;text-align:center}
  .toast.show{opacity:1}
  /* ---- harmonogram (Gantt) ----
     Osa je PO DNECH a sirsi nez obrazovka — sirku pocita JS a dava ji
     inline, tady jsou jen barvy a chovani. Sloupec se jmenem drzi
     u leveho okraje (sticky), at clovek pri jizde do strany vi, ci je radek. */
  .chartcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
  .hscroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
  .hgantt{position:relative}
  .hrow{display:flex;border-bottom:1px solid var(--line)}
  .hrow:last-child{border-bottom:0}
  .hlab{flex:0 0 186px;padding:9px 10px 9px 14px;font-size:13.5px;font-weight:600;
        border-right:1px solid var(--line);background:#fff;position:sticky;left:0;z-index:5}
  .hlab small{display:block;font-weight:400;font-size:11px;color:var(--ink2);margin-top:1px}
  .htrack{position:relative;flex:none;
          background:repeating-linear-gradient(to right,
              transparent 0 170px, rgba(26,60,94,.045) 170px 238px),
            repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 34px)}
  .hrow.hhdr{background:var(--int-soft);border-bottom:1px solid var(--line)}
  .hlab-hdr{background:var(--int-soft);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
            color:var(--ink2);display:flex;align-items:center}
  .htrack.hhead{background:none;height:46px}
  .hmesice{position:relative;height:19px;border-bottom:1px solid var(--line)}
  .hmesic{position:absolute;top:0;height:19px;display:flex;align-items:center;padding-left:8px;
          font-size:11px;font-weight:700;color:var(--navy);border-left:1px solid var(--line);
          text-transform:capitalize;white-space:nowrap;overflow:hidden}
  .hdny{display:flex;height:27px}
  .hden{flex:0 0 34px;display:flex;flex-direction:column;align-items:center;justify-content:center;
         border-left:1px solid var(--line);line-height:1.1}
  .hden i{font-style:normal;font-size:8.5px;font-weight:700;letter-spacing:.03em;color:var(--ink2)}
  .hden b{font-size:11px;color:var(--ink)}
  .hden.vik{background:rgba(26,60,94,.06)}
  .hden.vik i,.hden.vik b{color:var(--ink2)}
  .hden.dnesden b{color:var(--red);font-weight:800}
  .hbar{position:absolute;border-radius:6px;display:flex;align-items:center;
        padding:0 7px;overflow:hidden;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}
  .hbar span{position:relative;z-index:1}
  .hfill{position:absolute;left:0;top:0;bottom:0;background:currentColor;opacity:.18}
  .hb-done{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok)}
  .hb-now{background:var(--amber-soft);color:#8a6408;border:1px solid var(--amber)}
  .hb-next{background:var(--int-soft);color:var(--ink2);border:1px dashed #c3ccd6}
  .hb-late{background:#fdeceb;color:var(--red);border:1px solid var(--red)}
  .hb-kolize{background:#fdeceb;color:var(--red);border:2px solid var(--red)}
  .hb-nikdo{border-style:dotted}
  .hdnes{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:4;pointer-events:none}
  .hdnes.hlabeled::after{content:"dnes";position:absolute;top:1px;left:4px;font-size:9px;font-weight:800;
    letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
  .hlegend{display:flex;gap:8px 16px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);
           font-size:12px;color:var(--ink2)}
  .hlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
  /* Bublina u cihlicky harmonogramu — vlastni misto nativniho title,
     ktery je pomaly a oreze popis. pointer-events:none, aby neprekazela
     mysi pri prejizdeni po ose. */
  .etbub{position:fixed;display:none;z-index:200;max-width:330px;min-width:210px;
         background:#fff;border:1px solid var(--line);border-radius:11px;
         box-shadow:0 8px 24px rgba(16,32,48,.18);padding:0;pointer-events:none;
         font-size:13px;line-height:1.45;color:var(--ink)}
  .etbub-h{padding:10px 13px;border-left:4px solid var(--ink2);border-radius:11px 11px 0 0;
           background:var(--int-soft)}
  .etbub-h small{display:block;font-size:11px;color:var(--ink2)}
  .etbub-h b{display:block;font-size:14px;margin:1px 0 2px}
  .etbub-h span{font-size:12px;color:var(--ink2)}
  .etbub-skluz{padding:7px 13px;background:#fdeceb;color:var(--red);font-size:12.5px;font-weight:600}
  .etbub-body{margin:0;padding:10px 13px 10px 30px}
  .etbub-body li{margin-bottom:3px}
  .etbub-body li:last-child{margin-bottom:0}
  .etbub-nic{padding:10px 13px;color:var(--ink2);font-style:italic;font-size:12.5px}
  .etbub-lide{padding:8px 13px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2)}
  /* Na dotykovem zarizeni hover neexistuje — bublina by po tuknuti zustala
     viset. Tam se rovnou otevira okenko etapy. */
  @media(hover:none){ .etbub{display:none !important} }
  /* Na telefonu ukrajoval sloupec se jmenem pulku obrazovky a na osu
     zbylo par dni — jmeno se zuzi a zalomi. */
  @media(max-width:700px){
    .hlab{flex-basis:118px;padding:8px 6px 8px 9px;font-size:12px;white-space:normal;line-height:1.25}
    .hlab small{font-size:10px}
  }
  /* Hlavicka tabulky zustava videt pri scrollovani mesice. POZOR: sticky
     uvnitr ramu s overflow se lepi k TOMU RAMU, ne k obrazovce — proto ma
     ram vlastni vysku a roluje se v nem. Vyska se pocita z --lepeni,
     ktere meri JS po kazdem prekresleni (viz srovnejLepeni). */
  /* Ram ZAMERNE bez overflow: sticky uvnitr posuvneho ramu se lepi k tomu
     ramu, a jakmile odscrolluje ram, odejde s nim i hlavicka. Bez ramu se
     hlavicka lepi rovnou k obrazovce, pod lepici listu se jmenem. */
  /* .tablecard ma overflow:hidden kvuli zaoblenym rohum — a jakykoli
     overflow nad prvkem sticky vypina. U teto karty ho tedy zrusime
     a rohy orizneme jinak (clip-path zaobleni nechava, sticky neblokuje). */
  .tablecard.lepive{overflow:visible;clip-path:inset(0 round 10px)}
  /* Prilepena hlavicka musi mit NEPRUHLEDNE pozadi — jinak pod ni prosvitaji
     radky, ktere pod ni prijizdeji. Globalni th zadne pozadi nema. */
  .tablecard.lepive th{position:sticky;top:var(--lepeni,53px);z-index:20;
                       background:var(--int-soft);
                       box-shadow:0 2px 5px rgba(16,32,48,.10)}
  /* Na telefonu se sloupec Stavba schova, at se tabulka vejde bez posouvani
     do stran — pri posouvani by zmizelo datum a clovek by nevedel, ktery den
     odskrtava. Stavby jsou videt v zalozce Zaznamy. */
  .denkratky{display:none}
  /* Na telefonu se z tabulky stanou RADKY: zaskrtavatko, datum se zkratkou
     dne, hodiny, penize. Sloupce "Den" (cely nazev) a "Stavba" se schovaji —
     tim se tabulka vejde na sirku a nic se neposouva do stran, takze pri
     odskrtavani nikdy nezmizi datum. Stavby jsou v zalozce Zaznamy. */
  @media(max-width:700px){
    .denkratky{display:inline;font-weight:400;color:var(--ink2);font-size:12.5px}
    .tablecard.lepive th:nth-child(3), .tablecard.lepive td:nth-child(3),
    .tablecard.lepive th:nth-child(6), .tablecard.lepive td:nth-child(6){display:none}
    .tablecard.lepive td, .tablecard.lepive th{padding:11px 8px;border-right:0}
    .tablecard.lepive td:first-child, .tablecard.lepive th:first-child{padding:0 4px 0 8px}
    /* cely levy sloupec je terc pro prst — 44 px vysoka bunka */
    .tablecard.lepive td:first-child{min-width:46px}
    .tablecard.lepive tr td{min-height:44px}
    input[type=checkbox].vypl{width:26px;height:26px;margin:9px 0}
  }
  /* Zaskrtavatko vyplaty: hlavni akce obrazovky, musi se do nej trefit prst */
  input[type=checkbox].vypl{width:22px;height:22px;accent-color:var(--ok);cursor:pointer}
  @media(max-width:700px){ input[type=checkbox].vypl{width:26px;height:26px} }
  /* Posuvnik postupu etapy. Zamerne vysoky terc (28 px palec) — nastavuje
     se prstem na stavbe, ne mysi u stolu. */
  .pctrow{display:flex;align-items:center;gap:14px}
  .pctslider{flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:99px;
             background:linear-gradient(to right,var(--ok) 0%,var(--ok) var(--f,0%),var(--int-soft) var(--f,0%),var(--int-soft) 100%);
             outline:none;margin:6px 0}
  .pctslider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;
             background:#fff;border:3px solid var(--ok);cursor:pointer;box-shadow:0 1px 4px rgba(16,32,48,.25)}
  .pctslider::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;
             border:3px solid var(--ok);cursor:pointer}
  .pctcislo{font-size:19px;font-weight:800;color:var(--ok);min-width:62px;text-align:right;
            font-variant-numeric:tabular-nums}
  /* ---- spodni zalozky u party a subdodavatelu ----
     Stejny vzor jako lista vedeni na telefonu. Ctyri polozky, takze se
     vejdou i na uzkou obrazovku bez posouvani. */
  .mtabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--navy);
         z-index:70;padding-bottom:var(--sab);box-shadow:0 -2px 10px rgba(0,0,0,.2)}
  .mtabs .mt{flex:1;padding:9px 2px;text-align:center;color:#c6d6e5;font-size:11px;
             font-weight:600;cursor:pointer;position:relative;line-height:1.25}
  .mtabs .mt .ic{display:block;font-size:19px;margin-bottom:1px}
  .mtabs .mt.active{color:#fff;background:var(--navy-d);box-shadow:inset 0 3px 0 var(--amber)}
  .mtabs .mt .bdg{position:absolute;top:4px;right:22%;background:var(--amber);color:#132c46;
                  font-size:10px;font-weight:800;border-radius:99px;padding:0 5px}
  .stabs-main{padding-bottom:calc(74px + var(--sab))}
  .chipselect{display:flex;gap:6px;flex-wrap:wrap}
  .chipselect button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font-size:12.5px;cursor:pointer;font-weight:600}
  .chipselect button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line);gap:10px}
  .kv:last-child{border-bottom:none}
  .mile{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
  .mile .dot{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--int-soft);color:var(--int)}
  .mile.done .dot{background:var(--ok);color:#fff}
  .mile.now .dot{background:var(--amber);color:#132c46}
  .mile.now b{color:var(--amber-d)}
  .hero{background:linear-gradient(135deg,var(--navy),#2a5a8a);color:#fff;border-radius:12px;padding:20px;margin-bottom:14px}
  .hero .hm{color:#a9bfd4;font-size:12.5px}
  .hero .prog{background:rgba(255,255,255,.18);margin:10px 0 6px}
  .mobilewrap{max-width:560px;margin:0 auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer}
  .stat .sic{width:38px;height:38px;border-radius:9px;background:var(--amber-soft);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .stat .sn{font-size:24px;font-weight:800;margin-left:auto}
  .stat .sn.warn{color:var(--red)}
  .stat .st2{font-size:12px;color:var(--ink2);font-weight:600}
  /* ---- ukoly v terenu: jedna karta, dve zalozky, dlazdice ----
     Barevny prouzek vlevo nese naléhavost, aby se to dalo prejet okem
     na telefonu ve svetle na stavbe. Zaskrtavatko je velke kvuli rukavicim. */
  .ukhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .uktabs{display:flex;gap:6px;margin:12px 0 10px}
  .uktabs .t{flex:1;text-align:center;padding:9px 6px;font-size:12.5px;font-weight:700;
    border-radius:9px;background:#f1f4f8;color:var(--int);cursor:pointer;user-select:none}
  .uktabs .t.active{background:var(--navy);color:#fff}
  .uk{display:flex;flex-direction:column;gap:8px}
  .ukol{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;
    background:#fff;border:1px solid var(--line);border-left:4px solid var(--st,#c8d2dc);
    border-radius:10px;padding:11px 13px}
  .ukol.po{--st:var(--red);background:#fffbfa}
  .ukol.dnes{--st:var(--amber);background:#fffdf7}
  .ukol.hot{--st:var(--ok);opacity:.5}
  .ukol .bx{width:26px;height:26px;border:2px solid #cbd4dd;border-radius:8px;display:grid;
    place-items:center;font-size:15px;font-weight:800;cursor:pointer;flex:none;background:#fff;color:#fff}
  .ukol .bx.on{background:var(--ok);border-color:var(--ok)}
  .ukol .tt{font-weight:700;font-size:14.5px;line-height:1.3;color:var(--navy-d)}
  .ukol.hot .tt{text-decoration:line-through}
  .ukol .mt{color:var(--int);font-size:12px;margin-top:5px;display:flex;flex-wrap:wrap;
    gap:5px 9px;align-items:center}
  .ukform{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:4px}
  .ukform label{margin-top:8px}
  .ukform label:first-child{margin-top:0}
  .uav{width:28px;height:28px;border-radius:50%;background:var(--amber);color:#132c46;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex:none}
  .urow{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid #f0f3f6;font-size:13px}
  .urow:last-child{border-bottom:none}
  .grouphead{background:#f4f6f9;font-weight:700;font-size:12px;padding:6px 8px;border-radius:6px;margin:8px 0 2px;color:#42505e}
  .ck{width:16px;height:16px;border:2px solid #cdd5dc;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none;cursor:pointer;color:#fff}
  .ck.on{background:var(--amber);border-color:var(--amber);color:#132c46;font-weight:800}
  .typecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
  .tcard{border:1px solid var(--line);border-radius:10px;padding:14px 10px;text-align:center;cursor:pointer;background:#fff;font-weight:700;font-size:12.5px}
  .tcard .tic{font-size:20px;display:block;margin-top:6px}
  .tcard.sel{background:var(--amber);border-color:var(--amber-d);color:#132c46}
  .formsec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
  .formsec h4{font-size:13.5px;color:var(--navy);margin-bottom:4px}
  /* Bezici pauza je videt na prvni pohled; po hodine zcervena, protoze
     hlaska mezitim davno zmizela a clovek uz ji nikdy neuvidi. */
  .pauzabox.bezi{border-color:#f2a91f;background:#fbf1da}
  .pauzabox.bezi.dlouha{border-color:#b3382c;background:#fbe9e7}
  .pauzabox.bezi.dlouha b{color:#b3382c}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  /* Delsi popisek se zalomi na dva radky (treba "E-mail investora (notifikace
     portalu)") a policko pod nim pak stoji niz nez jeho soused vedle.
     Tohle drzi policka zarovnana u spodni hrany bez ohledu na delku popisku. */
  .frow>div{display:flex;flex-direction:column;justify-content:flex-end}
  @media(max-width:700px){.frow{grid-template-columns:1fr}}
  .mapbox{background:linear-gradient(135deg,#dfe9e2,#cfdce9);border:1px solid var(--line);border-radius:10px;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#42505e;font-size:12.5px;gap:6px;padding:10px;text-align:center}
  .mapbox .pin{font-size:30px}
  @media(max-width:700px){
    .side{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;display:flex;overflow-x:auto;z-index:70;padding:0;padding-bottom:var(--sab);box-shadow:0 -2px 10px rgba(0,0,0,.2)}
    .side .it{flex:1;min-width:60px;padding:8px 2px}
    .side .it.active{box-shadow:inset 0 3px 0 var(--amber)}
    .shell{padding-bottom:calc(70px + var(--sab))}
    main{padding:10px}
    /* Na telefonu se horni lista odlepi a misto ni se prilepi STRIP —
       ten nese to, co clovek potrebuje i po odscrollovani: sipku zpet,
       nazev obrazovky, sipky mesicu, tlacitko Pridat. Logo, datum a avatar
       jsou jen ozdoba a klidne odjedou nahoru.
       Pevny odsazeni (top:53px jako na pocitaci) by nefungovalo — na uzke
       obrazovce se hlavicka zalomi do tri radku a vyska se meni. */
    .topbar{position:static}
    .strip{top:0}
    /* Kdyz se lista prilepi nahoru, leze pod stavovy radek iPhonu (hodiny,
       signal, baterka) a text se s nim prekryva. Ve chvili prilepeni si
       proto pripocte bezpecnou zonu — trida .prilepeno ji dava JS, protoze
       CSS samo nepozna, jestli je prvek prave prilepeny. */
    .strip.prilepeno{padding-top:calc(9px + var(--sat))}
  }
  .viewer{position:fixed;inset:0;background:rgba(12,22,36,.78);z-index:120;display:flex;align-items:center;justify-content:center;padding:14px}
  .viewer .vwrap{background:#fff;border-radius:12px;max-width:860px;width:100%;max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
  .viewer .vhead{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#f4f6f9;flex-wrap:wrap}
  .viewer .vbody{overflow:auto;flex:1;display:flex;justify-content:center;background:#dde3ea;min-height:300px}
  .viewer .vbody img{max-width:100%;height:auto;object-fit:contain}
  .viewer .vbody iframe{width:100%;min-height:70vh;border:none;background:#fff}
  /* ── galerie fotek ─────────────────────────────────────
     Mrizka ctvercovych dlazdic po dnech. Pomer stran drzi trik s paddingem
     (padding-top:100 %), ne aspect-ratio — to starsi iPhony neumi. */
  .fgbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
  .fgbar input[type=date],.fgbar select{width:auto;flex:1 1 128px;min-width:0;padding:8px 10px}
  .fgbar .btn{flex:none}
  .fgday{margin-bottom:20px}
  .fghead{display:flex;align-items:baseline;gap:10px;margin:0 2px 7px;flex-wrap:wrap}
  .fghead b{font-size:13.5px;color:var(--navy)}
  .fghead .pn{font-size:12px;font-weight:700;color:var(--amber-d)}
  .fghead .n{font-size:11.5px;color:var(--ink2);margin-left:auto;white-space:nowrap}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
  @media(min-width:700px){.fgrid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}}
  .fg{position:relative;border-radius:10px;overflow:hidden;background:#33475c;cursor:pointer}
  .fg:before{content:'';display:block;padding-top:100%}
  .fg img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
  .fg:hover img{transform:scale(1.05)}
  .fg .st{position:absolute;top:5px;right:5px;font-size:10px;background:rgba(255,255,255,.93);color:var(--ink);border-radius:99px;padding:1px 6px;font-weight:700}
  /* prohlizec pres celou obrazovku — tmave pozadi, fotka uprostred,
     kontext (den, zakazka, autor, veta ze zapisu) dole */
  .fviewer{position:fixed;top:0;left:0;right:0;bottom:0;background:#0b141f;z-index:130;display:flex;flex-direction:column;padding-top:var(--sat)}
  .fvtop{display:flex;align-items:center;gap:8px;padding:10px 14px;color:#c5d3e2;font-size:12.5px}
  .fvtop .sp{flex:1}
  .fvbtn{border:none;background:rgba(255,255,255,.13);color:#fff;border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
  .fvbtn:hover{background:rgba(255,255,255,.24)}
  .fvbody{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:pan-y}
  .fvbody img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
  .fvnav{position:absolute;top:50%;transform:translateY(-50%);border:none;background:rgba(10,20,32,.5);color:#fff;font-size:26px;line-height:1;width:44px;height:64px;cursor:pointer;border-radius:12px;z-index:2}
  .fvnav.prev{left:8px}.fvnav.next{right:8px}
  .fvnav:disabled{opacity:.18;cursor:default}
  @media(hover:none) and (pointer:coarse){.fvnav{display:none}}  /* na telefonu se listuje prstem */
  .fvhint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:4px 12px;border-radius:99px;font-size:12px;white-space:nowrap}
  .fvcap{padding:12px 16px calc(14px + var(--sab));color:#e8eef4;font-size:13px;display:flex;flex-direction:column;gap:3px}
  .fvcap b{font-size:14px}
  .fvcap span{color:#9db1c4;font-size:12.5px}
  .fvcap em{color:#cdd9e4;margin-top:2px;line-height:1.4}
  /* login */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--navy) 0%,#0e2033 100%);padding:16px;padding-top:calc(16px + var(--sat));padding-bottom:calc(16px + var(--sab))}
  .lbox{background:#fff;border-radius:14px;padding:28px 24px;width:100%;max-width:400px;box-shadow:0 18px 50px rgba(0,0,0,.4)}
  .lbox .lg{text-align:center;font-weight:800;font-size:18px;color:var(--navy);margin-bottom:2px}
  .lbox .lg em{font-style:normal;color:var(--amber-d)}
  .lbox .ls{text-align:center;color:var(--ink2);font-size:12.5px;margin-bottom:16px}
  .lerr{background:#fdeceb;color:var(--red);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-top:10px;display:none}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(0,0,0,.2);border-top-color:var(--navy);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .loading{min-height:100vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;color:var(--ink2)}
  .rosterlist .urow{cursor:pointer;border-radius:8px;padding:10px 8px}
  .rosterlist .urow:hover{background:var(--amber-soft)}
  .modal{position:fixed;inset:0;background:rgba(12,22,36,.6);z-index:110;display:flex;align-items:center;justify-content:center;padding:14px}
  .modal .mbox{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
  .mapreal{height:230px;border-radius:10px;border:1px solid var(--line);overflow:hidden;margin-top:10px;background:#e8edf1}
  .mapreal .leaflet-container{height:100%;width:100%;font:inherit}
  /* ── dlaždice "Přidat na plochu" ─────────────────────── */
  .instbox{display:flex;align-items:center;gap:12px;width:100%;margin-top:16px;padding:12px 14px;
    border:1.5px dashed var(--amber-d);border-radius:12px;background:var(--amber-soft);
    cursor:pointer;font-family:inherit;text-align:left}
  .instbox:hover{background:#fbe9c4}
  .instbox .ic{font-size:22px;flex:none}
  .instbox b{display:block;font-size:13px;color:var(--navy)}
  .instbox span{display:block;font-size:11.5px;color:#7c5806;line-height:1.35}
  .howto{font-size:13.5px;line-height:1.6}
  .howto ol{margin:10px 0 0 20px}
  .howto li{margin-bottom:7px}
  .howto .k{background:#eef1f4;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-weight:700;white-space:nowrap}
  /* ── běžící směna ─────────────────────────────────────── */
  .smena{background:var(--ok-soft);border:1.5px solid #a7d8b6;border-radius:12px;padding:14px 16px;margin-top:4px}
  .smena .cas{font-size:26px;font-weight:800;color:var(--ok);line-height:1.15;letter-spacing:-.5px}
  .smena .kde{font-size:12.5px;color:#3c6b4c;margin-top:3px}
  .smena.mimo{background:var(--int-soft);border-color:#cdd5dc}
  .smena.mimo .cas{font-size:15px;color:var(--ink2);font-weight:700}
  .zamcena{display:flex;align-items:center;gap:8px;background:#f4f6f9;border:1px solid var(--line);
    border-radius:9px;padding:10px 12px;font-weight:700;font-size:14px;color:var(--ink)}
  .zamcena .zam{font-size:15px;opacity:.55}
  .pauzabox{display:flex;align-items:center;gap:11px;margin-top:10px;padding:11px 13px;
    border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;user-select:none}
  .pauzabox:hover{background:var(--amber-soft);border-color:var(--amber-d)}
  .pauzabox b{display:block;font-size:14px}
  .pauzabox small{display:block;font-size:11.5px;color:var(--ink2);line-height:1.35}
  .btn.velke{width:100%;justify-content:center;padding:15px;font-size:15.5px;margin-top:10px}
  /* ── iOS: pisma v polickach min. 16 px ─────────────────
     Safari na iPhonu stranku SAM priblizi, kdyz uzivatel tukne do policka
     s pismem mensim nez 16 px — a uz ji neoddali. Proto na dotykovych
     zarizenich vsechna policka na 16 px. Podminka je na dotyk, ne jen na
     sirku: iPhone na sirku ma pres 900 px a problem by se vratil.
     Zoom prstem zustava povoleny. */
  @media (hover:none) and (pointer:coarse), (max-width:900px){
    textarea, select,
    input[type=text], input[type=password], input[type=email],
    input[type=number], input[type=date], input[type=time],
    input[type=tel], input[type=search], .search input{ font-size:16px }
  }
  /* ── nabídka aktualizace ──────────────────────────────── */
  .updbar{position:fixed;left:0;right:0;bottom:0;z-index:300;background:var(--navy);color:#fff;
    display:flex;align-items:center;gap:12px;padding:12px 16px;padding-bottom:calc(12px + var(--sab));
    box-shadow:0 -3px 14px rgba(0,0,0,.28);font-size:13.5px}
  .updbar b{display:block;font-size:14px}
  .updbar small{color:#b9c9d8;font-size:12px}
  .updbar .btn{flex:none}
  .updspin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
</style>
</head>
<body>
<div id="root"><div class="loading"><span class="spin" style="width:26px;height:26px"></span>Načítám Deník staveb…</div></div>
<div id="viewer"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<div id="updbar"></div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  /* Leaflet dava svym vrstvam z-index 400 az 1000, ale kontejneru mapy zadny.
     Bez toho se vrstvy mapy poradi primo proti strance, takze mapa z detailu
     stavby prekryla otevrene okno "Upravit projekt" (okno ma z-index 110).
     z-index:0 na kontejneru uzavre vrstvy mapy dovnitr, takze uz nikam nelezou.
     Plati i pro prohlizec fotek a hlasky. */
  .leaflet-container{ position:relative; z-index:0 }
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" integrity="sha384-ZaR6mWzmJtrRibZ1Vm7SoHFr8OXjyAuGAXalGDKqbxFT18oi/z+oZLIRFkpeNor1" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" integrity="sha384-I1LYojsZ5RM1cOda44Z2h42Qa6YfsQ1XkXxREnhp4ueYBR/4d1pG1K+NZM537Vsj" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" integrity="sha384-Ke0FJhH7LyRqDxZ0wt+/OXV38yfQVu7g9VPEEGjYmB4RVOY/ta04uecRhsMwT7V3" crossorigin="anonymous"></script>
<script src="vypocty.js?v=20260831ah"></script>
<script src="navod.js?v=20260831ah"></script>
<script src="config.js?v=20260831ah"></script>
<script src="app.js?v=20260831ah"></script>
</body>
</html>
